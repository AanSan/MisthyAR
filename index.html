<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aetheria: AR Perspective Riddle</title>
    <meta name="description" content="Temukan rahasia kuno yang tersembunyi dalam dimensi 3D dan AR. Sejajarkan sudut pandangmu untuk mengungkap teka-teki.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Orbitron:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main stylesheet -->
    <link rel="stylesheet" href="styles.css">
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <!-- Webcam background element for AR -->
    <video id="webcam" autoplay playsinline></video>

    <!-- Three.js Canvas Container -->
    <div id="canvas-container"></div>
    
    <!-- UI Overlay -->
    <div id="ui-container">
        <div class="header">
            <h1 class="title">AETHERIA</h1>
            <div class="controls-header">
                <button id="audio-btn" class="btn-icon" title="Aktifkan Audio Suara"><i class="fa-solid fa-volume-xmark"></i></button>
                <button id="fullscreen-btn" class="btn-icon" title="Mode Layar Penuh"><i class="fa-solid fa-expand"></i></button>
            </div>
        </div>

        <!-- Menu Tab -->
        <div class="tabs">
            <button id="tab-single-btn" class="tab-btn active">Ritual Sendiri</button>
            <button id="tab-multi-btn" class="tab-btn">Ritual Bersama</button>
        </div>

        <!-- Single Player Panel -->
        <div id="single-player-panel" class="panel">
            <h2 id="level-title">Memuat Portal...</h2>
            <p id="level-desc">Silakan tunggu, menyelaraskan frekuensi dimensi kuno...</p>
            <p id="level-hint" class="hint"></p>
        </div>

        <!-- Multiplayer Panel -->
        <div id="multiplayer-panel" class="panel hidden">
            <div class="input-group">
                <input type="text" id="player-name-input" placeholder="Masukkan Nama Anda" maxlength="15">
            </div>
            <div id="color-picker-container">
                <span class="label">Warna Aura:</span>
                <button class="color-btn active" data-color="#00ffff" style="background:#00ffff;"></button>
                <button class="color-btn" data-color="#8a2be2" style="background:#8a2be2;"></button>
                <button class="color-btn" data-color="#ff007f" style="background:#ff007f;"></button>
                <button class="color-btn" data-color="#00ff88" style="background:#00ff88;"></button>
            </div>
            <div class="actions">
                <button id="create-room-btn" class="btn btn-primary">Buka Gerbang (Host)</button>
                <div class="join-group">
                    <input type="text" id="room-code-input" placeholder="KODE" maxlength="4">
                    <button id="join-room-btn" class="btn btn-secondary">Masuk Gerbang</button>
                </div>
            </div>
        </div>

        <!-- Multiplayer HUD (Akan muncul ketika terhubung ke room) -->
        <div id="multiplayer-hud" class="multiplayer-hud hidden">
            <div class="hud-header">
                <span id="hud-room-display">ROOM: ----</span>
                <span id="hud-role-display" class="badge">PLAYER</span>
            </div>
            <div id="player-list-container">
                <!-- Diisi via JavaScript secara dinamis -->
            </div>
            <div class="hud-chat-actions">
                <button id="mp-chat-btn" class="btn btn-secondary btn-small">
                    <i class="fa-solid fa-message"></i> Kirim Bisikan
                </button>
                <div id="mp-chat-menu" class="mp-chat-menu hidden">
                    <button class="mp-chat-option" data-msg="Coba lihat dari atas! 👁️">👁️ Dari atas</button>
                    <button class="mp-chat-option" data-msg="Sejajarkan ke samping! ➡️">➡️ Ke samping</button>
                    <button class="mp-chat-option" data-msg="Hampir sejajar sempurna! ✨">✨ Hampir sejajar</button>
                    <button class="mp-chat-option" data-msg="Cahaya mulai menyatu! 🌟">🌟 Cahaya menyatu</button>
                    <button class="mp-chat-option" data-msg="Ritual luar biasa! 🎉">🎉 Luar biasa!</button>
                </div>
            </div>
        </div>
    </div>

    <!-- AR fallback banner/instructions -->
    <div id="ar-fallback-alert" class="ar-alert hidden">
        <div class="ar-alert-content">
            <p><i class="fa-solid fa-triangle-exclamation"></i> Browser ini tidak mendukung WebXR AR penuh. Menggunakan simulator orbit giroskopik.</p>
            <button id="close-ar-alert-btn">OK</button>
        </div>
    </div>

    <!-- MQTT.js for multiplayer synchronization -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <script src="app.js"></script>
    <script src="multiplayer.js"></script>
</body>
</html>
